<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch: Große Fehlersuche (8 Fehler)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--primary-color);
        }

        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 5px; }
        .instructions { color: #666; text-align: center; margin-bottom: 25px; max-width: 600px; font-size: 0.95rem; }

        .game-container {
            background: white;
            padding: clamp(15px, 5vw, 35px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
        }

        .text-block {
            font-size: 1.25rem;
            line-height: 2.3;
            text-align: left;
            margin-bottom: 30px;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #eee;
            user-select: none;
        }

        .word {
            display: inline-block;
            cursor: pointer;
            padding: 0 3px;
            border-radius: 5px;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }

        .word:hover { background-color: #eee; }
        
        /* Status-Farben */
        .word.found { 
            background-color: #ccffcc !important; 
            color: #1b5e20; 
            border-bottom-color: var(--success-color);
            font-weight: bold;
        }
        
        .word.miss { 
            background-color: #fdedec; 
            border-bottom-color: var(--error-color);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #f0f7ff;
            padding: 10px 20px;
            border-radius: 10px;
        }

        .counter { color: var(--accent-color); font-weight: bold; font-size: 1.2rem; }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-restart { background: #95a5a6; color: white; }
        .btn-solve { background: var(--accent-color); color: white; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        #feedback { margin-top: 15px; text-align: center; font-weight: bold; min-height: 24px; }

        @media (max-width: 480px) {
            .text-block { font-size: 1.1rem; line-height: 2.6; }
            .instructions { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <h1>Thema 1: Fehlersuche (Найти ошибки)</h1>
    <p class="instructions">
        Finde die <b>8 Grammatikfehler</b> im Text von Ira (weiblich). <br>
        Tippe die falschen Wörter direkt im Text an!
    </p>

    <div class="game-container">
        <div class="status-bar">
            <span>Gefundene Fehler:</span>
            <span class="counter" id="errorCounter">0 / 8</span>
        </div>

        <div class="text-block" id="textBlock">
            <!-- Text wird per JS generiert -->
        </div>

        <div id="feedback"></div>

        <div class="controls">
            <button class="btn-solve" onclick="showSolution()">Lösung anzeigen</button>
            <button class="btn-restart" onclick="initGame()">Neu starten</button>
        </div>
    </div>

    <script>
        const originalText = [
            { w: "Привет!" }, { w: "Меня" }, { w: "зовут" }, { w: "Ира." },
            { w: "Я" }, { w: "родился", isError: true, correct: "родилась" }, 
            { w: "в" }, { w: "Россия", isError: true, correct: "России" }, { w: "в" }, { w: "Ейске." },
            { w: "Мне" }, { w: "25" }, { w: "года,", isError: true, correct: "лет," },
            { w: "но" }, { w: "сейчас" }, { w: "я" }, { w: "живу" }, { w: "в" }, 
            { w: "Москва.", isError: true, correct: "Москве." },
            { w: "Я" }, { w: "работаю" }, { w: "преподаватель", isError: true, correct: "преподавателем" },
            { w: "и" }, { w: "хорошо" }, { w: "говорю" }, { w: "по-английский.", isError: true, correct: "по-английски." },
            { w: "Я" }, { w: "очень" }, { w: "люблю" }, { w: "путешествую.", isError: true, correct: "путешествовать." },
            { w: "Ещё" }, { w: "у" }, { w: "меня" }, { w: "есть" }, { w: "собаку", isError: true, correct: "собака" }, 
            { w: "Вольт." }
        ];

        let foundCount = 0;
        const totalErrors = originalText.filter(item => item.isError).length;

        function initGame() {
            foundCount = 0;
            document.getElementById('errorCounter').innerText = `0 / ${totalErrors}`;
            document.getElementById('feedback').innerText = "";
            renderText();
        }

        function renderText() {
            const container = document.getElementById('textBlock');
            container.innerHTML = "";
            
            originalText.forEach((item, index) => {
                const span = document.createElement('span');
                span.className = "word";
                span.innerText = item.w;
                span.onclick = () => handleWordClick(span, item);
                container.appendChild(span);
                container.appendChild(document.createTextNode(" "));
            });
        }

        function handleWordClick(element, item) {
            if (element.classList.contains('found')) return;

            if (item.isError) {
                element.classList.add('found');
                foundCount++;
                updateCounter();
                
                if (foundCount === totalErrors) {
                    const fb = document.getElementById('feedback');
                    fb.innerText = "🎉 Fantastisch! Du hast alle 8 Fehler entdeckt.";
                    fb.style.color = "var(--success-color)";
                }
            } else {
                element.classList.add('miss');
                setTimeout(() => element.classList.remove('miss'), 500);
            }
        }

        function updateCounter() {
            document.getElementById('errorCounter').innerText = `${foundCount} / ${totalErrors}`;
        }

        function showSolution() {
            const spans = document.querySelectorAll('.word');
            originalText.forEach((item, index) => {
                if (item.isError) {
                    spans[index].classList.add('found');
                    spans[index].innerText = item.correct + " ✓";
                }
            });
            foundCount = totalErrors;
            updateCounter();
            document.getElementById('feedback').innerText = "Lösung wird angezeigt.";
            document.getElementById('feedback').style.color = "var(--accent-color)";
        }

        // Start
        initGame();
    </script>
</body>
</html>
