<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch: Odd One Out</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--primary-color);
        }

        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 5px; }
        .instructions { color: #666; text-align: center; margin-bottom: 25px; max-width: 600px; }

        .game-card {
            background: white;
            padding: clamp(20px, 5vw, 40px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .word-tile {
            background: #fff;
            border: 2px solid #ddd;
            padding: 20px 10px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .word-tile:hover { border-color: var(--accent-color); background: #f0f7ff; }
        .word-tile.correct { background-color: #ccffcc; border-color: var(--success-color); color: #1b5e20; }
        .word-tile.wrong { background-color: #fdedec; border-color: var(--error-color); color: #7b241c; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: var(--success-color);
            width: 0%;
            transition: width 0.4s;
        }

        #feedback-text {
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .explanation { font-size: 0.9rem; font-weight: normal; color: #7f8c8d; margin-top: 5px; }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-restart { background: #95a5a6; color: white; }
        .btn-solution { background: var(--accent-color); color: white; }

        @media (max-width: 400px) {
            .grid-container { grid-template-columns: 1fr; }
            .word-tile { padding: 15px; }
        }
    </style>
</head>
<body>

    <h1>Thema 1: Was passt nicht? (Лишнее слово)</h1>
    <p class="instructions">Klicke das Wort an, das <b>nicht</b> in die Reihe passt.</p>

    <div class="game-card">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        
        <div id="feedback-text">Finde den Außenseiter!</div>

        <div class="grid-container" id="wordGrid">
            <!-- Wörter werden hier geladen -->
        </div>

        <div class="controls">
            <button class="btn-solution" id="solveBtn" onclick="showSolution()">Lösung anzeigen</button>
            <button class="btn-restart" onclick="initGame()">Neu starten</button>
        </div>
    </div>

    <script>
        const quizData = [
            { 
                words: ["Россия", "Франция", "Германия", "Английский"], 
                odd: "Английский", 
                reason: "Das ist eine Sprache, die anderen sind Länder." 
            },
            { 
                words: ["Работать", "Учиться", "Читать", "Школа"], 
                odd: "Школа", 
                reason: "Das ist ein Nomen, die anderen sind Verben." 
            },
            { 
                words: ["Йогой", "Музыкой", "Спортом", "Собака"], 
                odd: "Собака", 
                reason: "Das steht im Nominativ, die anderen im Instrumental." 
            },
            { 
                words: ["Имя", "Фамилия", "Отчество", "Возраст"], 
                odd: "Возраст", 
                reason: "Das gehört zum Alter, die anderen sind Teile des Namens." 
            },
            { 
                words: ["Один", "Два", "Пять", "Преподаватель"], 
                odd: "Преподаватель", 
                reason: "Das ist ein Beruf, die anderen sind Zahlen." 
            },
            { 
                words: ["Родился", "Посетил", "Учился", "Жила"], 
                odd: "Жила", 
                reason: "Das ist weiblich, die anderen sind männliche Verbformen." 
            },
            { 
                words: ["В России", "В Москве", "В Ейске", "В школу"], 
                odd: "В школу", 
                reason: "Das gibt eine Richtung an (Wohin?), die anderen den Ort (Wo?)." 
            },
            { 
                words: ["Собака", "Кошка", "Вольт", "Машина"], 
                odd: "Машина", 
                reason: "Das ist ein Fahrzeug, die anderen sind Tiere/Namen von Tieren." 
            }
        ];

        let currentIndex = 0;
        let canClick = true;

        function initGame() {
            currentIndex = 0;
            canClick = true;
            quizData.sort(() => Math.random() - 0.5);
            document.getElementById('solveBtn').style.display = 'inline-block';
            loadQuestion();
            updateProgress();
        }

        function loadQuestion() {
            const data = quizData[currentIndex];
            const grid = document.getElementById('wordGrid');
            grid.innerHTML = '';
            document.getElementById('feedback-text').innerHTML = "Finde den Außenseiter!";
            
            // Wörter für die aktuelle Frage mischen
            const shuffledWords = [...data.words].sort(() => Math.random() - 0.5);

            shuffledWords.forEach(word => {
                const div = document.createElement('div');
                div.className = 'word-tile';
                div.innerText = word;
                div.onclick = () => checkAnswer(word, div);
                grid.appendChild(div);
            });
            canClick = true;
        }

        function checkAnswer(selected, element) {
            if (!canClick) return;
            const correct = quizData[currentIndex].odd;
            const reason = quizData[currentIndex].reason;

            if (selected === correct) {
                canClick = false;
                element.classList.add('correct');
                document.getElementById('feedback-text').innerHTML = 
                    `Richtig! ✅ <div class="explanation">${reason}</div>`;
                
                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex < quizData.length) {
                        loadQuestion();
                        updateProgress();
                    } else {
                        finishGame();
                    }
                }, 2500);
            } else {
                element.classList.add('wrong');
                document.getElementById('feedback-text').innerText = "Leider falsch. ❌";
                setTimeout(() => element.classList.remove('wrong'), 800);
            }
        }

        function updateProgress() {
            const progress = (currentIndex / quizData.length) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
        }

        function showSolution() {
            if (!canClick) return;
            const correct = quizData[currentIndex].odd;
            const tiles = document.querySelectorAll('.word-tile');
            tiles.forEach(tile => {
                if (tile.innerText === correct) {
                    checkAnswer(correct, tile);
                }
            });
        }

        function finishGame() {
            document.getElementById('progress-fill').style.width = '100%';
            document.getElementById('wordGrid').innerHTML = "";
            document.getElementById('solveBtn').style.display = 'none';
            document.getElementById('feedback-text').innerHTML = 
                "🎉 Wahnsinn! Du hast alle Außenseiter entlarvt.";
        }

        initGame();
    </script>
</body>
</html>
